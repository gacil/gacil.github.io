<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="90mm" height="55mm" role="img" aria-label="Kartu Nama GOSALDO - Mochamad Tabrani (Depan)">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071519" />
      <stop offset="52%" stop-color="#0B2026" />
      <stop offset="100%" stop-color="#050F13" />
    </linearGradient>

    <linearGradient id="leftPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2229" />
      <stop offset="100%" stop-color="#061317" />
    </linearGradient>

    <radialGradient id="logoHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#FACC15" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#071519" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="topRightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14B8A6" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#071519" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldLineV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="0" />
      <stop offset="25%" stop-color="#FACC15" stop-opacity="0.7" />
      <stop offset="75%" stop-color="#5EEAD4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="goldAccentH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="55%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>

    <linearGradient id="topTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="36%" stop-color="#FACC15" />
      <stop offset="70%" stop-color="#5EEAD4" />
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0.3" />
