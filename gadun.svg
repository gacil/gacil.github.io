<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#22252a" />
      <stop offset="100%" stop-color="#111316" />
    </radialGradient>

    <!-- Gold Gradient (Roda Gigi & Tanduk) -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7dc88" />
      <stop offset="50%" stop-color="#d4a238" />
      <stop offset="100%" stop-color="#9e711b" />
    </linearGradient>

    <!-- Cyan/Blue Gradient (Banteng & Perisai) -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ce1e6" />
      <stop offset="50%" stop-color="#00a8e8" />
      <stop offset="100%" stop-color="#005f99" />
    </linearGradient>

    <!-- Silver/White Gradient (Teks GADUN) -->
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#b8bec8" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Latar Belakang -->
  <rect width="800" height="500" fill="url(#bg-grad)" />

  <!-- GRUP EMBLEM UTAMA (Tengah: 400, 185) -->
  <g transform="translate(400, 185)" filter="url(#drop-shadow)">
    
    <!-- 1. Roda Gigi Emas (12 Gigi) -->
    <g fill="url(#gold-grad)">
      <circle cx="0" cy="0" r="105" />
      <g id="gear-teeth">
        <rect x="-14" y="-122" width="28" height="22" rx="4" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(30)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(60)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(90)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(120)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(150)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(180)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(210)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(240)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(270)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(300)" />
        <rect x="-14" y="-122" width="28" height="22" rx="4" transform="rotate(330)" />
      </g>
    </g>

    <!-- 2. Lingkaran Dalam Gelap & Cincin Putih -->
    <circle cx="0" cy="0" r="88" fill="#17191d" />
    <path d="M -76 20 A 78 78 0 1 1 55 55" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" />

    <!-- 3. Siluet Banteng (Bull) & Jalur Sirkuit -->
    <g>
      <!-- Badan & Leher Sirkuit Kiri -->
      <path d="M -65 30 C -65 -20, -30 -55, 10 -55 L 35 -55 L 55 -30 L 65 -10 L 50 10 L 32 5 L 25 25 L -15 45 Z" fill="#17191d" stroke="url(#cyan-grad)" stroke-width="4" stroke-linejoin="round" />
      
      <!-- Kepala & Moncong Banteng -->
      <path d="M 15 -55 L 48 -42 L 62 -15 L 46 8 L 28 -2 L 15 -22 Z" fill="url(#cyan-grad)" />
      <!-- Mata Banteng -->
      <polygon points="34,-32 45,-28 38,-22" fill="#17191d" />

      <!-- Garis Sirkuit pada Leher Banteng -->
      <g stroke="url(#cyan-grad)" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M -58 15 L -35 -8 L -18 -8" />
        <circle cx="-15" cy="-8" r="3.5" fill="#17191d" />
        
        <path d="M -52 32 L -28 8 L -12 8" />
        <circle cx="-9" cy="8" r="3.5" fill="#17191d" />

        <path d="M -42 46 L -22 26" />
        <circle cx="-20" cy="24" r="3.5" fill="#17191d" />
      </g>

      <!-- Tanduk Banteng (Kombinasi Emas & Biru) -->
      <path d="M 22 -52 C 15 -78, 45 -92, 68 -108 C 55 -85, 42 -72, 36 -48 Z" fill="url(#gold-grad)" stroke="url(#cyan-grad)" stroke-width="2.5" />
      <path d="M 42 -42 C 58 -58, 78 -62, 92 -78 C 82 -55, 65 -42, 48 -32 Z" fill="url(#gold-grad)" stroke="url(#cyan-grad)" stroke-width="2.5" />
    </g>

    <!-- 4. Perisai Bawah & Simbol Dolar ($) -->
    <g transform="translate(0, 32)">
      <!-- Bentuk Perisai -->
      <path d="M -38 -15 L 0 -22 L 38 -15 L 34 25 C 30 48, 0 65, 0 65 C 0 65, -30 48, -34 25 Z" fill="#17191d" stroke="url(#cyan-grad)" stroke-width="5" stroke-linejoin="round" />
      
      <!-- Simbol Dolar ($) -->
      <text x="0" y="38" text-anchor="middle" font-family="&#39;Arial Black&#39;, Impact, sans-serif" font-size="56" font-weight="900" fill="url(#cyan-grad)">
        $
      </text>
    </g>
  </g>

  <!-- GRUP TIPOGRAFI -->
  <g text-anchor="middle">
    <!-- Teks Utama: GADUN -->
    <text x="400" y="395" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, &#39;Arial Black&#39;, sans-serif" font-size="76" font-weight="900" letter-spacing="6" fill="url(#silver-grad)">
      GADUN
    </text>

    <!-- Aksen Titik Sirkuit di dalam Huruf A (Gaya Tech) -->
    <circle cx="313" cy="381" r="4" fill="#17191d" stroke="#d4a238" stroke-width="2" />

    <!-- Subjudul: GUDANG MESIN UANG | AUTONOMOUS FOUNDRY -->
    <text x="400" y="428" font-family="&#39;Montserrat&#39;, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#d1d5db">
      GUDANG MESIN UANG <tspan fill="#d4a238">|</tspan> AUTONOMOUS FOUNDRY
    </text>
  </g>
</svg>
